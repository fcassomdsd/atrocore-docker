stages:
  - validate
  - release

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SKELETON_VARIANT: atrocore
  BUILD_VARIANT: base
  PRODUCTION_DOMAIN: localhost
  PRODUCTION_STABILITY: stable
  TESTING_DOMAIN: ""
  TESTING_STABILITY: rc
  POSTGRES_PASSWORD: ci_postgres_password
  POSTGRES_PIM_USER: ci_user
  POSTGRES_PIM_PASSWORD: ci_password
  POSTGRES_PIM_DB: atrocore
  POSTGRES_PIM_DB_TEST: ""

default:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  before_script:
    - apk add --no-cache bash
    - docker version
    - docker compose version
    - |
      cat > .env <<EOF
      SKELETON_VARIANT=${SKELETON_VARIANT}
      BUILD_VARIANT=${BUILD_VARIANT}
      PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}
      PRODUCTION_STABILITY=${PRODUCTION_STABILITY}
      TESTING_DOMAIN=${TESTING_DOMAIN}
      TESTING_STABILITY=${TESTING_STABILITY}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      POSTGRES_PIM_USER=${POSTGRES_PIM_USER}
      POSTGRES_PIM_PASSWORD=${POSTGRES_PIM_PASSWORD}
      POSTGRES_PIM_DB=${POSTGRES_PIM_DB}
      POSTGRES_PIM_DB_TEST=${POSTGRES_PIM_DB_TEST}
      EOF

# Fast, stack-free validation of the tracked metadata overlay. The smoke jobs
# below boot containers and check a table count, which says nothing about the
# team's actual deliverable (metadata/).
validate:metadata:
  stage: validate
  image: python:3.12-alpine
  before_script: []
  script:
    - python3 scripts/validate-metadata.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

blank_instance_check:
  stage: validate
  script:
    - rm -rf db-data web-data
    - mkdir -p db-data web-data
    - docker compose up -d --build db atro-web
    - |
      for i in $(seq 1 60); do
        if docker compose exec -T db pg_isready -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" >/dev/null 2>&1; then
          echo "PostgreSQL is ready"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "PostgreSQL did not become ready in time"
          docker compose logs db || true
          exit 1
        fi
        echo "Waiting for PostgreSQL to be ready... ($i/60)"
        sleep 2
      done
    - docker compose ps
    - docker compose exec -T db psql -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" -c "SELECT 1;"
    - ./scripts/backup-db.sh
    - test -n "$(find db-dumps -maxdepth 1 -type f -name '*.dump' -size +0c | head -n 1)"
  after_script:
    - docker compose down -v || true

# `sql/seed-demo-dataset.sql` is applied to a live database locally and in the
# quickstart; this pipeline cannot do that. The `atro-web` image built here
# starts Apache with a DocumentRoot that does not exist — the AtroCore
# application is never installed, so its schema never appears and there is
# nothing to seed. (The previous `demo_seed_check` job worked around that by
# skipping itself whenever `atrocore.dump` was absent, which — since dumps are
# gitignored — was every run; it then asserted only that some public tables
# existed, which was already true against an empty database.)
#
# So validate the seed's invariants instead: additive-only (every DELETE scoped
# to demo- rows), no TRUNCATE, every row id namespaced, the row count matching
# its documentation, and --remove covering every table the seed writes. Fast,
# no containers, and it always runs.
validate:seed:
  stage: validate
  image: python:3.12-alpine
  before_script: []
  script:
    - python3 scripts/validate-demo-seed.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Releases are CalVer-tagged from CHANGELOG.md and gated on a prepared release
# entry: the tag is the date of the newest "## [YYYY-MM-DD]" section, the
# pipeline fails when that section is missing, when CHANGELOG.md is unchanged
# since the previous release, or when the tag already exists. The CHANGELOG is
# the release trigger: a merge to the default branch that does not touch
# CHANGELOG.md produces no release. See scripts/release-tag.sh and
# CONTRIBUTING.md ("Versioning and releases").
compute_release_tag:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - sh scripts/release-tag.test.sh
    - sh scripts/release-tag.sh --env-file release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    ref: '$CI_COMMIT_SHA'
    description: 'See CHANGELOG.md for the changes in $RELEASE_TAG'
