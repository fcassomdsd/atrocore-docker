stages:
  - validate
  - release

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  SKELETON_VARIANT: atrocore
  BUILD_VARIANT: base
  PRODUCTION_DOMAIN: localhost
  PRODUCTION_STABILITY: stable
  TESTING_DOMAIN: ""
  TESTING_STABILITY: rc
  POSTGRES_PASSWORD: ci_postgres_password
  POSTGRES_PIM_USER: ci_user
  POSTGRES_PIM_PASSWORD: ci_password
  POSTGRES_PIM_DB: atrocore
  POSTGRES_PIM_DB_TEST: ""

default:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  before_script:
    - apk add --no-cache bash
    - docker version
    - docker compose version
    - |
      cat > .env <<EOF
      SKELETON_VARIANT=${SKELETON_VARIANT}
      BUILD_VARIANT=${BUILD_VARIANT}
      PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}
      PRODUCTION_STABILITY=${PRODUCTION_STABILITY}
      TESTING_DOMAIN=${TESTING_DOMAIN}
      TESTING_STABILITY=${TESTING_STABILITY}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      POSTGRES_PIM_USER=${POSTGRES_PIM_USER}
      POSTGRES_PIM_PASSWORD=${POSTGRES_PIM_PASSWORD}
      POSTGRES_PIM_DB=${POSTGRES_PIM_DB}
      POSTGRES_PIM_DB_TEST=${POSTGRES_PIM_DB_TEST}
      EOF

# Fast, stack-free validation of the tracked metadata overlay. The smoke jobs
# below boot containers and check a table count, which says nothing about the
# team's actual deliverable (metadata/).
validate:metadata:
  stage: validate
  image: python:3.12-alpine
  before_script: []
  script:
    - python3 scripts/validate-metadata.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# The fresh-install check. This job used to assert only that PostgreSQL answered and a
# backup could be written, which said nothing about whether a new user gets a working
# system — and it passed throughout the period when a clean clone could not build its
# application or its schema at all. It now walks the README's steps 3–8 on an empty
# database: build, bootstrap the application out of the image, run AtroCore's own install,
# install the tracked model, sync the schema, seed, and check the result. `web-data/` and
# `db-data/` are deleted first, so this is exactly what `git clone` + `docker compose up`
# gives someone.
validate:fresh-install:
  stage: validate
  variables:
    # `install-atrocore.sh` takes these from ../compliance_flow/.env, which is not checked out
    # here, so the job supplies its own. They become the super admin the platform logs in as.
    ATROCORE_USERNAME: ci_admin
    ATROCORE_PASSWORD: ci_admin_password
    # Published ports live on the dind service, not the job container, so `localhost` does not
    # reach them here — the service alias does.
    ATROCORE_BASE_URL: http://docker
  script:
    # `python3` is needed by install-metadata.sh (register-entity-tab.py) and `curl` by
    # install-atrocore.sh; the default before_script has already installed bash and written .env.
    - apk add --no-cache python3 curl
    - rm -rf db-data web-data
    - mkdir -p db-data web-data
    - docker compose up -d --build db atro-web
    - |
      for i in $(seq 1 90); do
        if docker compose exec -T db pg_isready -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" >/dev/null 2>&1; then
          echo "PostgreSQL is ready"
          break
        fi
        if [ "$i" -eq 90 ]; then
          echo "PostgreSQL did not become ready in time"
          docker compose logs db || true
          exit 1
        fi
        echo "Waiting for PostgreSQL to be ready... ($i/90)"
        sleep 2
      done
    - ./scripts/bootstrap-web-data.sh
    - ./scripts/install-atrocore.sh --yes
    # DDL migrations run BEFORE install-metadata.sh + `sql diff --run`, because `sql diff` is a
    # Doctrine comparator with drops included: a migration that has to read a column the new
    # metadata removes must get there first. A no-op on a fresh database, which is exactly what
    # exercises each migration's fresh-install guard -- nothing else in CI ran this script.
    - ./scripts/migrate-db.sh --yes
    # Console as www-data: exec defaults to root, and root-owned cache files break the web
    # process on its next write (HTTP 500 on every API route).
    - ./scripts/install-metadata.sh
    - docker compose exec -T -u www-data atro-web php /var/www/localhost/console.php clear cache
    - docker compose exec -T -u www-data atro-web php /var/www/localhost/console.php sql diff --run
    - ./scripts/seed-usoap-vocabularies.sh --yes
    - ./scripts/seed-icao-reference-data.sh --yes
    - ./scripts/seed-usoap-evidence-expectations.sh --yes
    - ./scripts/seed-nomenclatura.sh --yes
    - ./scripts/seed-demo-dataset.sh --yes
    # The adopter's placeholder dataset, applied to a real schema so a row that no longer fits
    # the metadata (a required link, a missing column) fails here instead of on someone's first
    # install, then the same rows again through the import module (ImportFeed + CSV import).
    # `import-data-pack.sh` exits non-zero on any import error.
    - ./scripts/seed-starter-dataset.sh --yes
    # `ATROCORE_API_BASE` because this job reaches the stack through the dind alias, not localhost.
    - |
      if ! ATROCORE_API_BASE="${ATROCORE_BASE_URL}/api/v1" ./scripts/import-data-pack.sh --all; then
        echo "--- data-pack import failed; last 80 lines of the AtroCore log:"
        docker compose logs --tail=80 atro-web || true
        exit 1
      fi
    - ATROCORE_HOST_BASE="${ATROCORE_BASE_URL}" ./scripts/install-layouts.sh --yes
    - ./scripts/enable-spanish-labels.sh --yes
    - |
      # The application must be usable, not merely present: `/api/v1/App/user` answers 401 only
      # once it is installed and wants authentication. Before this step existed the job passed
      # with a 500 here.
      code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "${ATROCORE_BASE_URL}/api/v1/App/user")
      echo "  /api/v1/App/user = $code"
      [ "$code" = "401" ] || { echo "FAIL: AtroCore is not installed (expected 401, got $code)"; exit 1; }
    - |
      check() { # check <sql> <label> <expected>
        got=$(docker compose exec -T db psql -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" -tAc "$1")
        echo "  $2 = $got"
        [ "$got" = "$3" ] || { echo "FAIL: expected $2 = $3, got '$got'"; exit 1; }
      }
      check "select count(*) from location where id like 'demo-%'"         "demo locations"     1
      check "select count(*) from service_provider where id like 'demo-%'" "demo providers"     2
      check "select count(*) from inspector where id like 'demo-%'"        "demo inspectors"    3
      check "select count(*) from inspection where id like 'demo-%'"       "demo inspections"   3
      # The starter dataset, seeded and then re-imported through the data packs above.
      check "select count(*) from location where id like 'starter-%'"      "starter locations"  1
      check "select count(*) from normativa where id like 'starter-%'"     "starter articles"   2
      check "select count(*) from location_service where id like 'starter-%'" "starter location services" 1
      check "select count(*) from inspector_specialty where inspector_id like 'starter-%'" "starter inspector specialties" 1
      check "select count(*) from location_service_specialty where location_service_id like 'starter-%'" "starter location service specialties" 1
      # The starter cadence. It exists with zero site visits, which is the whole point of
      # anchoring InspectionCadence on LocationService instead of the per-visit InspectedProvider.
      check "select count(*) from inspection_cadence where id like 'starter-%'" "starter cadences" 1
      check "select count(*) from site_visit where id not like 'demo-%'" "non-demo site visits" 0
      # Migration 0002 re-pointed the link: the old columns must be gone and the new one present.
      check "select count(*) from information_schema.columns where table_name='inspection_cadence' and column_name in ('inspected_provider_id','location_id')" "dropped cadence columns" 0
      check "select count(*) from information_schema.columns where table_name='inspection_cadence' and column_name='location_service_id'" "cadence location_service_id" 1
      check "select count(*) from specialty"                                "specialties"       3
      check "select count(*) from \"user\" where id='1' and is_admin"       "super admin"        1
      check "select count(*) from extensible_enum where code in ('riskLevel','inspectorRoles','findingClass','compliance','usoapCriticalElement','usoapAreaCode','usoapArtifactCategory')" "seeded vocabularies" 7
      # Tables that only exist if the recovered operational model was installed.
      check "select count(*) from information_schema.tables where table_schema='public' and table_name in ('service_area','site_visit','finding','corrective_action','documento_o_a_c_i')" "operational tables" 5
      # The ICAO reference catalog (documents/paragraphs/protocol questions/citations) — real
      # rows only, excluding the demo dataset's own demo-doc-a10v3 / demo-pq-* / demo-acapite-*.
      check "select count(*) from documento_o_a_c_i where id not like 'demo-%'"                     "ICAO Annex documents"   15
      check "select count(*) from acapite_o_a_c_i where id not like 'demo-%'"                        "ICAO Annex paragraphs"  1890
      check "select count(*) from usoap_protocol_question where id not like 'demo-%'"                 "ICAO Protocol Questions" 281
      check "select count(*) from usoap_protocol_question_acapite_o_a_c_i where id not like 'demo-%'" "ICAO PQ citations"      439
      check "select count(*) from usoap_evidence_expectation" "USOAP evidence expectations" 48
      # every expectation must have resolved its parent PQ by code
      check "select count(*) from usoap_evidence_expectation where usoap_protocol_question_id is null" "unresolved expectation parents" 0
      # The default layout profile and the layouts scripts/install-layouts.sh materialises into it.
      check "select count(*) from layout where layout_profile_id='default' and deleted=false" "materialised layouts" 123
      check "select count(*) from extensible_enum_option where name_es_do is not null and deleted=false" "es_DO vocabulary labels" 8
      check "select jsonb_array_length(navigation::jsonb) from layout_profile where id='default'" "default profile groups" 7
    - ./scripts/backup-db.sh
    - test -n "$(find db-dumps -maxdepth 1 -type f -name '*.dump' -size +0c | head -n 1)"
  after_script:
    - docker compose down -v || true
  # Merge request pipelines only. Every change lands through an MR, so this both gates the
  # merge and runs the expensive build once instead of also on the develop push that follows.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# The live seed run now happens in `validate:fresh-install` above, which deletes
# `web-data`/`db-data`, builds, installs the tracked model, syncs the schema and runs all
# four seeds. This job stays as the fast, container-free companion: it validates the
# seed's invariants — additive-only (every DELETE scoped to demo- rows), no TRUNCATE,
# every row id namespaced, the row count matching its documentation, `--remove` covering
# every table the seed writes, and every extensible enum the tracked entity definitions
# reference by id being created by `seed-usoap-vocabularies.sql`. It runs in seconds and
# needs no Docker, so it catches a broken seed on the first push rather than ten minutes
# into an image build.
# The credential preflight's own self-test. Builds throwaway workspaces in a
# temp directory -- no stack, no Docker, no network -- so it is cheap enough to
# gate every merge request. It exists because a gate that can only fail gets
# bypassed, so the cases assert that a genuinely production-ready workspace
# PASSES as well as that the demo one is refused.
validate:preflight-secrets:
  stage: validate
  image: alpine:latest
  before_script: []
  script:
    - apk add --no-cache bash git
    - bash scripts/preflight-secrets.test.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

validate:seed:
  stage: validate
  image: python:3.12-alpine
  before_script: []
  script:
    - python3 scripts/validate-seeds.py
    - python3 scripts/validate-data-packs.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Supply-chain scanning (P3.2). No repository had any security scanning before
# this.
#
# Gate policy, chosen from measurement rather than aspiration:
#
#   CRITICAL -> blocking.   Measured across all six repos on 2026-09-26: zero.
#                           So this gate is green today and genuinely stops a
#                           regression, rather than being red on arrival.
#   HIGH     -> reported.   33 findings exist today (21 in compliance_web, 12
#                           in compliance_checklist), all with fixes available.
#                           Blocking on HIGH immediately would red every
#                           pipeline in those two repos and the gate would be
#                           switched off within a day -- which is worse than no
#                           gate, because a disabled gate still reads as
#                           protection. Clear the backlog, then raise the bar
#                           here to HIGH,CRITICAL.
#
# --ignore-unfixed: a CVE with no available fix is information, not an action.
# The scan is skipped on scheduled pipelines so a new CVE disclosure cannot
# turn an unrelated nightly run red.
# ---------------------------------------------------------------------------
security:scan:
  stage: validate
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  # This job brings its own image, so it must opt out of any global or
  # `default:` before_script. compliance_checklist's runs `npm ci` and
  # atrocore-docker's calls the Docker CLI -- neither exists in the Trivy
  # image, and both fail the job before the scan starts. Declared here for
  # every repo, not just the two that have one today, so adding a global
  # before_script later cannot silently break this job.
  before_script: []
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  script:
    # Blocking: any fixable CRITICAL fails the pipeline.
    # --skip-dirs excludes generated and bind-mounted runtime trees, not source.
    # web-data/ in particular is the AtroCore application installed at container
    # bootstrap: it is gitignored, absent from a fresh checkout, and vendors its
    # own npm tree, so scanning it here reports upstream's dependencies as if
    # they were this repository's. (It is not clean: upstream currently vendors
    # a CRITICAL prototype-pollution advisory in swiper. That belongs in an
    # upstream report and in image scanning, not in a gate on tracked source.)
    - trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 1 .
    # Reporting: HIGH is printed and saved, but does not fail the job yet.
    - trivy fs --scanners vuln --severity HIGH --ignore-unfixed --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage --exit-code 0 --format table -o trivy-high.txt . || true
    - 'echo "--- HIGH findings (not blocking; see the policy comment in .gitlab-ci.yml) ---"'
    - cat trivy-high.txt || true
    # SBOM, always produced, never blocking. CycloneDX is the format the
    # release process will consume once images are published and signed.
    - trivy fs --format cyclonedx --skip-dirs web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage -o sbom.cdx.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-high.txt
      - sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Releases are CalVer-tagged from CHANGELOG.md and gated on a prepared release
# entry: the tag is the date of the newest "## [YYYY-MM-DD]" section, the
# pipeline fails when that section is missing, when CHANGELOG.md is unchanged
# since the previous release, or when the tag already exists. The CHANGELOG is
# the release trigger: a merge to the default branch that does not touch
# CHANGELOG.md produces no release. See scripts/release-tag.sh and
# CONTRIBUTING.md ("Versioning and releases").
# The whole-stack demo. `validate:fresh-install` covers AtroCore and the four seeds; everything
# after that — the identities, the imports, the closure walkthrough and the oversight artifacts —
# needs the other five repositories side by side, which a single-repo checkout does not have. This
# job assembles that layout (`scripts/demo-verify-ci.sh` clones the siblings; all six projects are
# public and cloned over HTTPS at `develop`), brings the stack up and runs the demo quickstart.
#
# It is deliberately NOT a merge-request gate. It builds five projects and boots Alfresco, Solr,
# ActiveMQ, the transform service, Node-RED and two Node services, so it takes on the order of
# twenty minutes and needs a runner with memory to match; the per-repo pipelines stay the gate.
# Run it on a schedule (`CI_PIPELINE_SOURCE == "schedule"`) or by hand from the pipeline UI — a
# schedule is the only way the demo is checked without someone remembering to press the button.
#
# `SIBLING_REF` is what makes it a *demo* guard rather than a per-branch one: it clones every
# sibling at `develop`, so it answers "does the demo work on today's integration branches?".
# Point it at a branch to check a matching set of changes before they are merged.
demo:verify:
  stage: validate
  variables:
    SIBLING_REF: develop
  script:
    # `git` for the sibling clones, `python3` for the .env merge and `nodejs` because the quickstart
    # parses every JSON response with `node` (runbook §1.1 lists it as a host prerequisite); bash and
    # curl come from the default before_script, which also writes this project's .env.
    - apk add --no-cache python3 curl git nodejs
    - ./scripts/demo-verify-ci.sh
  after_script:
    # Runs even when the demo fails, so a failed job does not leave five stacks and their volumes
    # behind on the runner.
    - ./scripts/demo-verify-ci.sh --teardown || true
  rules:
    # Scheduled: it runs unattended.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Everywhere else it is offered as a manual button, never a gate — `allow_failure` keeps a
    # failed demo run from blocking a pipeline it was not asked to gate, and being manual means
    # no pipeline pays for it unless somebody presses it (or a schedule fires).
    - when: manual
      allow_failure: true

compute_release_tag:
  stage: release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - sh scripts/release-tag.test.sh
    - sh scripts/release-tag.sh --env-file release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - CHANGELOG.md
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    ref: '$CI_COMMIT_SHA'
    description: 'See CHANGELOG.md for the changes in $RELEASE_TAG'
