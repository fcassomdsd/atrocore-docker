# Serve /health from the image rather than from the application tree (P3.5).
#
# A server-level conf, not a per-vhost block: startup.sh generates one vhost
# per configured domain, and a check that exists on only some of them is a
# check someone will eventually probe on the wrong one.
#
# Alias resolves during translate_name, so the request never lands under
# DocumentRoot and AtroCore's own .htaccess rewrite rules -- which would
# otherwise send /health into the front controller and answer 404 -- do not
# apply. That is the whole reason this is an Alias and not a file dropped in
# public/: the application tree is a bind mount that may be empty, and its
# rewrite rules own every path inside it.
Alias /health /opt/atrocore-health/health.php

<Directory /opt/atrocore-health>
    Require all granted
    AllowOverride None
    Options -Indexes
</Directory>
