services:
  atro-web:
    build:
      context: .docker
      dockerfile: php/Dockerfile
      target: ${BUILD_VARIANT:-base}
    # No build args: this image no longer installs AtroCore at build time (see the Dockerfile
    # comment and scripts/bootstrap-web-data.sh) — the values that used to be passed here
    # (SKELETON_VARIANT, PRODUCTION_STABILITY, DB credentials, etc.) are read directly from
    # .env by that script instead.
    environment:
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-localhost}
      TESTING_DOMAIN: ${TESTING_DOMAIN}
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
    volumes:
      - ./web-data:/var/www/
    restart: unless-stopped
    # Health (P3.5). /health is served from the image at /opt, not from the
    # bind-mounted application tree -- see .docker/health.conf.
    #
    # start_period is 40s rather than the usual few seconds because this
    # container's first start does real work: startup.sh writes a vhost per
    # domain, sets up cron and only then execs apache2-foreground. Failures
    # during start_period do not count against retries, so the window costs
    # nothing when the container is fine and avoids a spurious `unhealthy` on
    # a cold boot.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Container hardening (P3.2).
    #
    # NOT read_only and NOT user: this container installs the AtroCore
    # application into the bind-mounted ./web-data at first run
    # (scripts/bootstrap-web-data.sh), then writes its cache, logs and
    # uploads there as www-data for the rest of its life. Apache also needs to
    # start as root to bind :80 before dropping privileges. Both controls are
    # structurally inapplicable to this service as it is deployed, not merely
    # postponed -- changing that means changing how AtroCore is installed.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - atrocore_net
      - backend_ext_net

  db:
    image: postgres:15-alpine@sha256:620dc79c45816cff4f38f0b49c71f15a3bc6bab9439ba1eea3a76d23ebcf1e4d
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PIM_USER: ${POSTGRES_PIM_USER}
      POSTGRES_PIM_PASSWORD: ${POSTGRES_PIM_PASSWORD}
      POSTGRES_PIM_DB: ${POSTGRES_PIM_DB}
      POSTGRES_PIM_DB_TEST: ${POSTGRES_PIM_DB_TEST}
    volumes:
      - .docker/postgres/scripts:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data/
      - ${WAL_ARCHIVE_DIR:-./wal-archive}:/wal-archive
    # WAL archiving (P3.4). archive_timeout=300 forces a segment switch every
    # five minutes even when idle, which is what bounds RPO: without it an
    # inactive database can hold an unarchived segment indefinitely.
    #
    # OPERATIONAL HAZARD, stated because it is the way this configuration
    # bites: if archive_command starts failing, PostgreSQL does NOT discard
    # the WAL -- it retains every segment until archiving succeeds, and the
    # data volume fills until the database stops. Monitor
    # pg_stat_archiver.failed_count; it is on P3.5's alert list for exactly
    # this reason. The `test ! -f` guard makes the command idempotent so a
    # retry cannot fail on an already-archived segment.
    command: postgres -c archive_mode=on -c "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f" -c archive_timeout=300 -c wal_level=replica
    restart: unless-stopped
    # Health (P3.5). pg_isready against this container's own socket, with the
    # database name given explicitly: with no -d it defaults to the connecting
    # user's name, which is not a database here, and pg_isready reports the
    # server up regardless -- so the wrong form passes for the wrong reason and
    # would keep passing if the database were dropped.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_PIM_DB} -h 127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # As with compliance_web's db: the official Postgres image chowns its data
    # directory and drops privileges at startup, so cap_drop: ALL and a
    # read-only rootfs break it. These two controls apply cleanly.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - atrocore_net

volumes:
  web-data:
  db-data:

networks:
  atrocore_net:
    driver: bridge
  backend_ext_net:
    name: backend_net

