services:
  atro-web:
    build:
      context: .docker
      dockerfile: php/Dockerfile
      target: ${BUILD_VARIANT:-base}
    # No build args: this image no longer installs AtroCore at build time (see the Dockerfile
    # comment and scripts/bootstrap-web-data.sh) — the values that used to be passed here
    # (SKELETON_VARIANT, PRODUCTION_STABILITY, DB credentials, etc.) are read directly from
    # .env by that script instead.
    environment:
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-localhost}
      TESTING_DOMAIN: ${TESTING_DOMAIN}
    ports:
      - 80:80
    volumes:
      - ./web-data:/var/www/
    restart: unless-stopped
    networks:
      - atrocore_net
      - backend_ext_net

  db:
    image: postgres:15-alpine@sha256:620dc79c45816cff4f38f0b49c71f15a3bc6bab9439ba1eea3a76d23ebcf1e4d
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PIM_USER: ${POSTGRES_PIM_USER}
      POSTGRES_PIM_PASSWORD: ${POSTGRES_PIM_PASSWORD}
      POSTGRES_PIM_DB: ${POSTGRES_PIM_DB}
      POSTGRES_PIM_DB_TEST: ${POSTGRES_PIM_DB_TEST}
    volumes:
      - .docker/postgres/scripts:/docker-entrypoint-initdb.d
      - ./db-data:/var/lib/postgresql/data/
    restart: unless-stopped
    networks:
      - atrocore_net

volumes:
  web-data:
  db-data:

networks:
  atrocore_net:
    driver: bridge
  backend_ext_net:
    name: backend_net

