name: CI

# Mirror of this repository's GitLab CI validation jobs, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal jobs are mirrored here; release automation stays GitLab-only.
#
# demo-verify (below) clones the other five repositories as siblings from GitLab, not from
# their own GitHub mirrors — GitHub's role here is visibility, not a second source of truth,
# so this job proves "does the demo work on today's integration branches" the same way
# GitLab's own demo:verify does, just running on GitHub's infrastructure.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Matches GitLab's demo:verify: never a merge gate, checked unattended on a schedule so it
    # doesn't depend on someone remembering to press the button. Mondays, early UTC.
    - cron: '17 6 * * 1'

jobs:
  validate-metadata:
    # Fast, stack-free validation of the tracked metadata overlay — no Docker needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-metadata.py

  validate-seed:
    # The fast, container-free companion to validate-fresh-install below: validates the seed's
    # invariants (additive-only, no TRUNCATE, every row id namespaced, row counts matching
    # documentation, every extensible enum the tracked entity definitions reference by id being
    # created) in seconds, without Docker — plus that the `data-packs/` CSV templates still
    # describe exactly the rows the starter seed writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-seeds.py
      - run: python3 scripts/validate-data-packs.py

  validate-preflight-secrets:
    # Self-test for scripts/preflight-secrets.sh, the gate that refuses to call
    # a deployment "production" while it runs on credentials published in these
    # repositories. Builds throwaway workspaces in a temp dir — no stack, no
    # Docker, no network. Asserts that a genuinely production-ready workspace
    # PASSES as well as that the demo one is refused: a gate that can only fail
    # gets bypassed, and a bypassed gate still reads as protection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/preflight-secrets.test.sh

  validate-fresh-install:
    # Walks the README's steps on an empty database: build, bootstrap the application out of
    # the image, run AtroCore's own install, install the tracked model, sync the schema, seed,
    # and check the result — exactly what a clean `git clone` + `docker compose up` gives
    # someone. ubuntu-latest ships Docker + Compose natively, so no dind service is needed here
    # the way GitLab's job needs one.
    runs-on: ubuntu-latest
    env:
      SKELETON_VARIANT: atrocore
      BUILD_VARIANT: base
      PRODUCTION_DOMAIN: localhost
      PRODUCTION_STABILITY: stable
      TESTING_DOMAIN: ''
      TESTING_STABILITY: rc
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_PIM_USER: ci_user
      POSTGRES_PIM_PASSWORD: ci_password
      POSTGRES_PIM_DB: atrocore
      POSTGRES_PIM_DB_TEST: ''
      # install-atrocore.sh takes these from ../compliance_flow/.env, which isn't checked out
      # here, so the job supplies its own. They become the super admin the platform logs in as.
      ATROCORE_USERNAME: ci_admin
      ATROCORE_PASSWORD: ci_admin_password
      ATROCORE_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env <<EOF
          SKELETON_VARIANT=${SKELETON_VARIANT}
          BUILD_VARIANT=${BUILD_VARIANT}
          PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}
          PRODUCTION_STABILITY=${PRODUCTION_STABILITY}
          TESTING_DOMAIN=${TESTING_DOMAIN}
          TESTING_STABILITY=${TESTING_STABILITY}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_PIM_USER=${POSTGRES_PIM_USER}
          POSTGRES_PIM_PASSWORD=${POSTGRES_PIM_PASSWORD}
          POSTGRES_PIM_DB=${POSTGRES_PIM_DB}
          POSTGRES_PIM_DB_TEST=${POSTGRES_PIM_DB_TEST}
          EOF

      - name: Clean slate
        run: |
          rm -rf db-data web-data
          mkdir -p db-data web-data

      - name: Build and start db + atro-web
        run: docker compose up -d --build db atro-web

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T db pg_isready -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            if [ "$i" -eq 90 ]; then
              echo "PostgreSQL did not become ready in time"
              docker compose logs db || true
              exit 1
            fi
            echo "Waiting for PostgreSQL to be ready... ($i/90)"
            sleep 2
          done

      - run: ./scripts/bootstrap-web-data.sh
      - run: ./scripts/install-atrocore.sh --yes
      # Before install-metadata.sh + `sql diff --run`: see the note in .gitlab-ci.yml.
      - run: ./scripts/migrate-db.sh --yes

      # Console as www-data: exec defaults to root, and root-owned cache files break the web
      # process on its next write (HTTP 500 on every API route).
      - run: ./scripts/install-metadata.sh
      - run: docker compose exec -T -u www-data atro-web php /var/www/localhost/console.php clear cache
      - run: docker compose exec -T -u www-data atro-web php /var/www/localhost/console.php sql diff --run

      - run: ./scripts/seed-usoap-vocabularies.sh --yes
      - run: ./scripts/seed-icao-reference-data.sh --yes
      - run: ./scripts/seed-usoap-evidence-expectations.sh --yes
      - run: ./scripts/seed-nomenclatura.sh --yes
      - run: ./scripts/seed-demo-dataset.sh --yes
      # The adopter's placeholder dataset, applied to a real schema so a row that no longer fits
      # the metadata (a required link, a missing column) fails here instead of on someone's
      # first install.
      - run: ./scripts/seed-starter-dataset.sh --yes
      # The other onboarding route to the same rows: ImportFeed + ImportConfiguratorItem are
      # created over the API and every CSV is imported. Non-zero on any import error, and on a
      # database the starter seed just populated every row should come back unchanged.
      # On failure, dump the AtroCore log too: the runner reports each failing ImportJob's own
      # message, and the container log carries the queue job's failure detail behind it.
      - name: Import every data pack
        run: |
          if ! ./scripts/import-data-pack.sh --all; then
            echo "--- data-pack import failed; last 80 lines of the AtroCore log:"
            docker compose logs --tail=80 atro-web || true
            exit 1
          fi
      - run: ./scripts/install-layouts.sh --yes
      - run: ./scripts/enable-spanish-labels.sh --yes

      - name: Assert the application is actually installed
        run: |
          # /api/v1/App/user answers 401 only once it is installed and wants authentication.
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "${ATROCORE_BASE_URL}/api/v1/App/user")
          echo "  /api/v1/App/user = $code"
          [ "$code" = "401" ] || { echo "FAIL: AtroCore is not installed (expected 401, got $code)"; exit 1; }

      - name: Assert the seeded/synced data is correct
        run: |
          check() { # check <sql> <label> <expected>
            got=$(docker compose exec -T db psql -U "$POSTGRES_PIM_USER" -d "$POSTGRES_PIM_DB" -tAc "$1")
            echo "  $2 = $got"
            [ "$got" = "$3" ] || { echo "FAIL: expected $2 = $3, got '$got'"; exit 1; }
          }
          check "select count(*) from location where id like 'demo-%'"         "demo locations"     1
          check "select count(*) from service_provider where id like 'demo-%'" "demo providers"     2
          check "select count(*) from inspector where id like 'demo-%'"        "demo inspectors"    3
          check "select count(*) from inspection where id like 'demo-%'"       "demo inspections"   3
          # The starter dataset, seeded and then re-imported through the data packs above.
          check "select count(*) from location where id like 'starter-%'"      "starter locations"  1
          check "select count(*) from normativa where id like 'starter-%'"     "starter articles"   2
          check "select count(*) from location_service where id like 'starter-%'" "starter location services" 1
          check "select count(*) from inspector_specialty where inspector_id like 'starter-%'" "starter inspector specialties" 1
          check "select count(*) from location_service_specialty where location_service_id like 'starter-%'" "starter location service specialties" 1
          # The starter cadence exists with zero site visits -- the point of anchoring
          # InspectionCadence on LocationService rather than the per-visit InspectedProvider.
          check "select count(*) from inspection_cadence where id like 'starter-%'" "starter cadences" 1
          check "select count(*) from site_visit where id not like 'demo-%'" "non-demo site visits" 0
          # Migration 0002 re-pointed the link.
          check "select count(*) from information_schema.columns where table_name='inspection_cadence' and column_name in ('inspected_provider_id','location_id')" "dropped cadence columns" 0
          check "select count(*) from information_schema.columns where table_name='inspection_cadence' and column_name='location_service_id'" "cadence location_service_id" 1
          check "select count(*) from specialty"                                "specialties"       3
          check "select count(*) from \"user\" where id='1' and is_admin"       "super admin"        1
          check "select count(*) from extensible_enum where code in ('riskLevel','inspectorRoles','findingClass','compliance','usoapCriticalElement','usoapAreaCode','usoapArtifactCategory')" "seeded vocabularies" 7
          check "select count(*) from information_schema.tables where table_schema='public' and table_name in ('service_area','site_visit','finding','corrective_action','documento_o_a_c_i')" "operational tables" 5
          check "select count(*) from documento_o_a_c_i where id not like 'demo-%'"                     "ICAO Annex documents"   15
          check "select count(*) from acapite_o_a_c_i where id not like 'demo-%'"                        "ICAO Annex paragraphs"  1890
          check "select count(*) from usoap_protocol_question where id not like 'demo-%'"                 "ICAO Protocol Questions" 281
          check "select count(*) from usoap_protocol_question_acapite_o_a_c_i where id not like 'demo-%'" "ICAO PQ citations"      439
          check "select count(*) from usoap_evidence_expectation" "USOAP evidence expectations" 48
          # every expectation must have resolved its parent PQ by code
          check "select count(*) from usoap_evidence_expectation where usoap_protocol_question_id is null" "unresolved expectation parents" 0
          # The default layout profile and the layouts scripts/install-layouts.sh materialises into it.
          check "select count(*) from layout where layout_profile_id='default' and deleted=false" "materialised layouts" 123
          check "select count(*) from extensible_enum_option where name_es_do is not null and deleted=false" "es_DO vocabulary labels" 8
          check "select jsonb_array_length(navigation::jsonb) from layout_profile where id='default'" "default profile groups" 7

      - run: ./scripts/backup-db.sh
      - run: test -n "$(find db-dumps -maxdepth 1 -type f -name '*.dump' -size +0c | head -n 1)"

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  demo-verify:
    # The whole-platform demo. validate-fresh-install above covers AtroCore and the three
    # seeds; everything after that — identities, imports, the closure walkthrough, the
    # oversight artifacts — needs the other five repositories side by side, which
    # scripts/demo-verify-ci.sh assembles by cloning them (from GitLab, not their GitHub
    # mirrors — GitHub's role here is visibility, not a second source of truth).
    #
    # Deliberately never a merge gate — it builds five projects and boots Alfresco, Solr,
    # ActiveMQ, the transform service, Node-RED and two Node services, so it takes on the
    # order of twenty minutes. Runs on workflow_dispatch (the button) or the weekly schedule
    # above, matching GitLab's own demo:verify job design exactly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      SKELETON_VARIANT: atrocore
      BUILD_VARIANT: base
      PRODUCTION_DOMAIN: localhost
      PRODUCTION_STABILITY: stable
      TESTING_DOMAIN: ''
      TESTING_STABILITY: rc
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_PIM_USER: ci_user
      POSTGRES_PIM_PASSWORD: ci_password
      POSTGRES_PIM_DB: atrocore
      POSTGRES_PIM_DB_TEST: ''
      # demo-verify-ci.sh auto-sets DEMO_HOST=docker whenever $CI is set, unless DEMO_HOST is
      # already set — that default is GitLab's dind service alias, which doesn't exist here.
      # ubuntu-latest runs Docker natively on the same host, so published ports really are on
      # localhost, same as a local (non-CI) run.
      DEMO_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write .env
        run: |
          cat > .env <<EOF
          SKELETON_VARIANT=${SKELETON_VARIANT}
          BUILD_VARIANT=${BUILD_VARIANT}
          PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN}
          PRODUCTION_STABILITY=${PRODUCTION_STABILITY}
          TESTING_DOMAIN=${TESTING_DOMAIN}
          TESTING_STABILITY=${TESTING_STABILITY}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_PIM_USER=${POSTGRES_PIM_USER}
          POSTGRES_PIM_PASSWORD=${POSTGRES_PIM_PASSWORD}
          POSTGRES_PIM_DB=${POSTGRES_PIM_DB}
          POSTGRES_PIM_DB_TEST=${POSTGRES_PIM_DB_TEST}
          EOF

      - run: ./scripts/demo-verify-ci.sh

      - name: Tear down
        if: always()
        run: ./scripts/demo-verify-ci.sh --teardown || true

  security-scan:
    # Supply-chain scanning (P3.2). Gate policy chosen from measurement:
    # CRITICAL is blocking (measured at zero across all six repos, so the gate
    # is green today and stops regressions); HIGH is reported but not blocking
    # while 33 known-fixable findings are cleared, because a gate that is red
    # on arrival gets switched off, and a disabled gate still reads as
    # protection. --skip-dirs excludes generated/bind-mounted runtime trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '1'
      - name: Report HIGH (non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          skip-dirs: web-data,db-data,data/alf_data,data/postgres-data,alf-data,dist,dist-portable,venv,.venv,coverage
          exit-code: '0'
