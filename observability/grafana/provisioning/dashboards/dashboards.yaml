apiVersion: 1

providers:
  - name: compliance-platform
    orgId: 1
    folder: "Compliance Platform"
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: the file in
    # git is the source of truth, and an edit made in the browser that
    # disappears on the next redeploy is a worse experience than one that was
    # never allowed.
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
