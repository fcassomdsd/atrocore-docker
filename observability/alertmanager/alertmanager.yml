# Alertmanager configuration (P3.5).
#
# NOTE ON THE ABSENCE OF ${VARIABLES} HERE
# ----------------------------------------
# Alertmanager does not expand environment variables in its configuration
# file. A `${SMTP_HOST}` written here would be used as a literal hostname, and
# the failure would show up as mail silently not arriving -- alerting that
# looks configured and is not, which is worse than alerting that is obviously
# absent. So this file holds literal values and is edited directly. Secrets are
# the exception and have a real mechanism: `smtp_auth_password_file`, below.
#
# THIS FILE IS THE PRODUCTION ONE, AND IT IS DELIBERATELY EMPTY
# -------------------------------------------------------------
# No delivery is configured here because the destination is not the
# platform's to choose. Where alerts go is site infrastructure -- an
# authority's own relay, their own domain, their own on-call arrangement --
# and a destination this project picked would be one nobody at that authority
# is reading. So this file is a template an adopter fills in, and
# scripts/preflight-secrets.sh --production refuses to pass until they have.
#
# It is NOT the default. observability/docker-compose.yaml mounts
# alertmanager.demo.yml unless ALERTMANAGER_CONFIG says otherwise, because a
# default that delivers nowhere is how this platform spent its first weeks
# detecting every failure it was built for and telling nobody. Set
# ALERTMANAGER_CONFIG=alertmanager.yml once this file is filled in.
#
# EMAIL IS NOT THE ONLY OPTION, AND OFTEN NOT THE EASIEST
# -------------------------------------------------------
# Both blocks below are equally supported; pick one, or several. A webhook
# into an existing ticketing system or chat channel is frequently simpler for
# a smaller authority than getting an SMTP relay provisioned, and it avoids
# putting a credential in a file at all. Alertmanager also has native
# slack_configs, msteams_configs, opsgenie_configs and pagerduty_configs --
# the preflight accepts any of them.

global:
  resolve_timeout: 5m

route:
  receiver: platform-default
  # Group by alertname and component rather than by instance: when Alfresco's
  # stack goes down, six probes fail at once and that is one incident, not six.
  group_by: ["alertname", "component"]
  group_wait: 30s
  group_interval: 5m
  # 4h, not the conventional 1h. On a single host with no on-call rota, an
  # alert that repeats hourly through a weekend is one that gets filtered into
  # a folder, and a filtered alert is an absent alert.
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: platform-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  # A receiver with no notifier. Alerts routed here are still recorded,
  # grouped and visible; nothing is sent anywhere.
  - name: platform-default

  - name: platform-critical
    # --- OPTION A: a webhook ------------------------------------------------
    #
    # Usually the least work: no relay to provision, no mailbox to watch, and
    # no credential in this file if the endpoint is on an internal network or
    # carries its own token in the URL path. Point it at a ticketing system,
    # an internal bot, or whatever an operator already has open.
    #
    # webhook_configs:
    #   - url: "https://tickets.internal.example/hooks/platform-alerts"
    #     send_resolved: true
    #     max_alerts: 0
    #
    # For a URL that must carry a secret, use http_config.authorization with
    # credentials_file rather than putting a token in this tracked file:
    #
    #     http_config:
    #       authorization:
    #         type: Bearer
    #         credentials_file: /run/secrets/alert_webhook_token
    #
    # --- OPTION B: email ----------------------------------------------------
    #
    # smtp_auth_password_file, not smtp_auth_password: this file is tracked in
    # git, and the platform's rule since P3.1 is that a credential in a
    # repository is a published credential. Mount the password as a file --
    # a Docker secret, or a file a Vault Agent writes -- and point at it here.
    # That is the same precedence the application services use.
    #
    # email_configs:
    #   - to: "ops@example.org"
    #     from: "alerts@example.org"
    #     smarthost: "smtp.example.org:587"
    #     auth_username: "alerts@example.org"
    #     auth_password_file: /run/secrets/smtp_password
    #     require_tls: true
    #     send_resolved: true
    #     headers:
    #       Subject: "[CRITICAL] {{ .GroupLabels.alertname }} - compliance platform"
    #
    # Whichever you choose, keep send_resolved: true. A path that only ever
    # reports failures leaves an operator unable to tell a fixed incident from
    # a forgotten one.
    #
    # Configure platform-default above as well, or every non-critical alert --
    # including DiskFillingUp, which is what fills a WAL archive and stops a
    # database -- is still delivered nowhere."

inhibit_rules:
  # When ActiveMQ or Solr is down, slow probes follow all over the stack.
  # Suppress the downstream noise so the cause stays legible: the measured
  # lesson from FOOTPRINT_AUDIT.md is that these two failures present as
  # symptoms elsewhere, and the symptom is what gets investigated first.
  - source_matchers:
      - alertname =~ "ActiveMQBrokerUnreachable|SolrUnreachable"
    target_matchers:
      - alertname = "HealthProbeSlow"
    equal: []

  # A database that is down cannot report on its own archiver, so its archiver
  # alerts say nothing that PostgresDown has not already said.
  - source_matchers:
      - alertname = "PostgresDown"
    target_matchers:
      - alertname =~ "WALArchivingFailing|WALArchiveBacklogGrowing"
    equal: ["database"]
