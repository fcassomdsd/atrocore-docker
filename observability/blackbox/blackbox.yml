# blackbox-exporter modules (P3.5).
modules:
  http_2xx:
    prober: http
    # 5s, well under Prometheus's 10s scrape_timeout. The timeout is the
    # substance of these probes rather than a detail: the failure this stack
    # was built to catch is a service that accepts a connection and then never
    # answers. Without a bound, the probe hangs exactly as the application does
    # and reports nothing -- reproducing the invisibility instead of ending it.
    timeout: 5s
    http:
      valid_status_codes: [200]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false

  http_2xx_or_redirect:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200, 301, 302]
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
